spring:
  config:
    import: classpath:prompt.yml
  application:
    name: ${SPRING_APPLICATION_NAME:ai-social-game}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localbase.testhut.top:23306/aisocialgame?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:aisocialgame}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TEST_QUERY:SELECT 1}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localbase.testhut.top}
      port: ${SPRING_DATA_REDIS_PORT:26379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
  grpc:
    client:
      channel:
        user:
          target: ${USER_GRPC_ADDR:static://localuserservice.testhut.top:22001}
          ssl:
            enabled: true
        billing:
          target: ${BILLING_GRPC_ADDR:static://localpayservice.testhut.top:22021}
          ssl:
            enabled: true
        ai:
          target: ${AI_GRPC_ADDR:static://localaiservice.testhut.top:22011}
          ssl:
            enabled: true

server:
  port: ${SERVER_PORT:${BACKEND_PORT:11031}}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    enable:
      all: false
      application.started.time: true
      application.ready.time: true
      process.start.time: true
      process.uptime: true
      http.server.requests: true
    tags:
      component: ai-social-game
      service: backend
      environment: ${DEPLOYMENT_ENVIRONMENT:local}
      release_id: ${RELEASE_ID:unknown}
      release_version: ${RELEASE_VERSION:unknown}
  endpoint:
    health:
      show-details: never

logging:
  file:
    name: ${LOGGING_FILE_NAME:${APP_LOG_DIR:./logs}/aisocialgame.log}
  structured:
    format:
      file: ecs
  pattern:
    level: "requestId=%X{requestId:-none} %5p"
  logback:
    rollingpolicy:
      max-file-size: ${LOGGING_MAX_FILE_SIZE:10MB}
      max-history: ${LOGGING_MAX_HISTORY:14}
      total-size-cap: ${LOGGING_TOTAL_SIZE_CAP:1GB}
      clean-history-on-start: ${LOGGING_CLEAN_HISTORY_ON_START:true}
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.aisocialgame: ${LOGGING_LEVEL_APP:INFO}

app:
  project-key: ${APP_PROJECT_KEY:aisocialgame}
  grpc:
    user-trust-cert-collection: ${GRPC_CLIENT_USER_SECURITY_TRUST_CERT_COLLECTION:}
    billing-trust-cert-collection: ${GRPC_CLIENT_BILLING_SECURITY_TRUST_CERT_COLLECTION:}
    ai-trust-cert-collection: ${GRPC_CLIENT_AI_SECURITY_TRUST_CERT_COLLECTION:}
  sso:
    user-service-base-url: ${SSO_USER_SERVICE_BASE_URL:https://localuserservice.testhut.top}
    callback-url: ${SSO_CALLBACK_URL:https://localsocialgame.testhut.top/sso/callback}
    login-path: ${SSO_LOGIN_PATH:/sso/login}
    register-path: ${SSO_REGISTER_PATH:/register}
  auth:
    token-ttl-hours: ${APP_AUTH_TOKEN_TTL_HOURS:168}
  redis:
    token-key-prefix: ${APP_REDIS_TOKEN_KEY_PREFIX:aisocialgame:auth:token:}
  ai:
    default-model: ${APP_AI_DEFAULT_MODEL:}
    system-user-id: ${APP_AI_SYSTEM_USER_ID:0}
  credit:
    checkin-grant-tokens: ${APP_CREDIT_CHECKIN_GRANT_TOKENS:20}
    temp-expiry-days: ${APP_CREDIT_TEMP_EXPIRY_DAYS:30}
    exchange-daily-limit: ${APP_CREDIT_EXCHANGE_DAILY_LIMIT:2000}
    redeem-failure-limit-per-day: ${APP_CREDIT_REDEEM_FAILURE_LIMIT_PER_DAY:10}
  websocket:
    enabled: ${APP_WEBSOCKET_ENABLED:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:11030,http://127.0.0.1:5173,http://127.0.0.1:4173,http://127.0.0.1:11030,http://localhost,https://localhost,https://localsocialgame.testhut.top,https://socialgame.testhut.top}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password-hash: ${APP_ADMIN_PASSWORD_HASH:}
    display-name: ${APP_ADMIN_DISPLAY_NAME:系统管理员}
    operator-user-id: ${APP_ADMIN_OPERATOR_USER_ID:1}
    totp-encryption-keys: ${ADMIN_TOTP_ENCRYPTION_KEYS:}
    totp-active-key-version: ${ADMIN_TOTP_ACTIVE_KEY_VERSION:v1}
    session-minutes: ${APP_ADMIN_SESSION_MINUTES:120}
    session-idle-minutes: ${APP_ADMIN_SESSION_IDLE_MINUTES:30}
    recovery-session-minutes: ${APP_ADMIN_RECOVERY_SESSION_MINUTES:15}
    recovery-session-idle-minutes: ${APP_ADMIN_RECOVERY_SESSION_IDLE_MINUTES:10}
    cookie-secure: ${APP_ADMIN_COOKIE_SECURE:true}
  security:
    allow-weak-runtime-defaults: ${APP_SECURITY_ALLOW_WEAK_RUNTIME_DEFAULTS:false}
    allow-plaintext-grpc: ${APP_SECURITY_ALLOW_PLAINTEXT_GRPC:false}
  demo-seed:
    enabled: ${APP_DEMO_SEED_ENABLED:false}
  external:
    payservice-plaintext-enabled: ${BILLING_GRPC_PLAINTEXT_ENABLED:false}
    grpc-auth-required: ${APP_EXTERNAL_GRPC_AUTH_REQUIRED:true}
    userservice-internal-grpc-token: ${APP_EXTERNAL_USERSERVICE_INTERNAL_GRPC_TOKEN:}
    userservice-jwt:
      caller-id: ${APP_EXTERNAL_USERSERVICE_JWT_CALLER_ID:aisocialgame}
      issuer: ${APP_EXTERNAL_USERSERVICE_JWT_ISSUER:aisocialgame}
      secret: ${APP_EXTERNAL_USERSERVICE_JWT_SECRET:}
      audience: ${APP_EXTERNAL_USERSERVICE_JWT_AUDIENCE:aienie-userservice-grpc}
      ttl-seconds: ${APP_EXTERNAL_USERSERVICE_JWT_TTL_SECONDS:300}
      scopes: ${APP_EXTERNAL_USERSERVICE_JWT_SCOPES:user.auth.session.read,user.directory.read,user.ban.read,user.ban.write}
    payservice-legacy-static-token: ${APP_EXTERNAL_PAYSERVICE_JWT:}
    payservice-jwt:
      caller-id: ${APP_EXTERNAL_PAYSERVICE_JWT_CALLER_ID:aisocialgame}
      issuer: ${APP_EXTERNAL_PAYSERVICE_JWT_ISSUER:aisocialgame}
      service: ${APP_EXTERNAL_PAYSERVICE_JWT_SERVICE:aisocialgame}
      secret: ${APP_EXTERNAL_PAYSERVICE_JWT_SECRET:}
      audience: ${APP_EXTERNAL_PAYSERVICE_JWT_AUDIENCE:aienie-payservice-grpc}
      role: ${APP_EXTERNAL_PAYSERVICE_JWT_ROLE:SERVICE}
      ttl-seconds: ${APP_EXTERNAL_PAYSERVICE_JWT_TTL_SECONDS:300}
      scopes: ${APP_EXTERNAL_PAYSERVICE_JWT_SCOPES:billing.balance.read,billing.checkin.write,billing.checkin.read,billing.ledger.read,billing.balance.convert,billing.onboarding.write,billing.redeem.write}
    aiservice-hmac-caller: ${APP_EXTERNAL_AISERVICE_HMAC_CALLER:}
    aiservice-hmac-secret: ${APP_EXTERNAL_AISERVICE_HMAC_SECRET:}

qdrant:
  host: ${QDRANT_HOST:http://localbase.testhut.top}
  http-port: ${QDRANT_PORT:26333}
  enabled: ${QDRANT_ENABLED:true}
  api-key: ${QDRANT_API_KEY:}

connection:
  disconnect-threshold-seconds: ${APP_CONNECTION_DISCONNECT_THRESHOLD_SECONDS:60}
