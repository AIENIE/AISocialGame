spring:
  config:
    import: classpath:prompt.yml
  application:
    name: ai-social-game
  datasource:
    url: ''
    username: aisocialgame
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ''
      port: 26379
      username: ''
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: false
  grpc:
    client:
      channel:
        user:
          target: ''
          ssl:
            enabled: true
        billing:
          target: ''
          ssl:
            enabled: true
        ai:
          target: ''
          ssl:
            enabled: true
server:
  port: '11031'
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    enable:
      all: false
      application.started.time: true
      application.ready.time: true
      process.start.time: true
      process.uptime: true
      http.server.requests: true
    tags:
      component: ai-social-game
      service: backend
      environment: develop
      release_id: unknown
      release_version: unknown
  endpoint:
    health:
      show-details: never
logging:
  file:
    name: ./logs/aisocialgame.log
  structured:
    format:
      file: ecs
  pattern:
    level: requestId=%X{requestId:-none} %5p
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: true
  level:
    root: INFO
    com.aisocialgame: INFO
app:
  project-key: aisocialgame
  grpc:
    user-trust-cert-collection: ''
    billing-trust-cert-collection: ''
    ai-trust-cert-collection: ''
  sso:
    user-service-base-url: ''
    callback-url: ''
    login-path: /sso/login
    register-path: /register
  auth:
    token-ttl-hours: 168
  redis:
    token-key-prefix: 'aisocialgame:auth:token:'
  ai:
    default-model: ''
    system-user-id: 0
  credit:
    checkin-grant-tokens: 20
    temp-expiry-days: 30
    exchange-daily-limit: 2000
    redeem-failure-limit-per-day: 10
  websocket:
    enabled: true
  cors:
    allowed-origins: ''
  admin:
    username: admin
    password-hash: ${APP_ADMIN_PASSWORD_HASH:}
    display-name: 系统管理员
    operator-user-id: 1
    totp-encryption-keys: ${ADMIN_TOTP_ENCRYPTION_KEYS:}
    totp-active-key-version: v1
    session-minutes: 120
    session-idle-minutes: 30
    recovery-session-minutes: 15
    recovery-session-idle-minutes: 10
    cookie-secure: true
  security:
    allow-weak-runtime-defaults: false
    allow-plaintext-grpc: false
  demo-seed:
    enabled: false
  external:
    payservice-plaintext-enabled: false
    grpc-auth-required: true
    userservice-jwt:
      caller-id: aisocialgame
      issuer: aisocialgame
      secret: ${GRPC_SHARED_SECRET}
      audience: aienie-userservice-grpc
      ttl-seconds: 300
      scopes: user.auth.session.read,user.directory.read,user.ban.read,user.ban.write
    payservice-jwt:
      caller-id: aisocialgame
      issuer: aisocialgame
      service: aisocialgame
      secret: ${GRPC_SHARED_SECRET}
      audience: aienie-payservice-grpc
      role: SERVICE
      ttl-seconds: 300
      scopes: billing.balance.read,billing.checkin.write,billing.checkin.read,billing.ledger.read,billing.balance.convert,billing.onboarding.write,billing.redeem.write
    aiservice-hmac-caller: ''
    aiservice-hmac-secret: ${GRPC_SHARED_SECRET}
qdrant:
  host: ''
  http-port: 26333
  enabled: true
  api-key: ${QDRANT_API_KEY:}
connection:
  disconnect-threshold-seconds: 60
runtime:
  configuration:
    ENV: ''
    AUTH_MODE: ''
    ADMIN_USERNAME: ''
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:}
    ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:}
    ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:}
ENV: ${runtime.configuration.ENV}
AUTH_MODE: ${runtime.configuration.AUTH_MODE}
