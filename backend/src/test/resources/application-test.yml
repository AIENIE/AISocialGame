spring:
  datasource:
    url: jdbc:h2:mem:aisocial;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: null
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  autoconfigure:
    exclude:
    - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
  grpc:
    client:
      channel:
        user:
          target: static://127.0.0.1:19001
          ssl:
            enabled: false
        billing:
          target: static://127.0.0.1:19002
          ssl:
            enabled: false
        ai:
          target: static://127.0.0.1:19003
          ssl:
            enabled: false
app:
  game:
    scheduler-enabled: false
  project-key: aisocialgame
  auth:
    token-ttl-hours: 24
  ai:
    default-model: test-model
    system-user-id: 1
  admin:
    username: admin
    password-hash: $2a$12$8GvJ7QwJm6n8qGkQ7FXTne04bD36NY0bUTP5N9lF3n1Q0BmzS5mJe
    session-minutes: 60
  external:
    grpc-auth-required: false
    userservice-jwt:
      secret: 0123456789abcdefABCDEFGHIJKLMNOPQRSTUVWXYZuvwxyz
    payservice-jwt:
      secret: 0123456789abcdefABCDEFGHIJKLMNOPQRSTUVWXYZuvwxyz
    aiservice-hmac-secret: 0123456789abcdefABCDEFGHIJKLMNOPQRSTUVWXYZuvwxyz
GRPC_SHARED_SECRET: 0123456789abcdefABCDEFGHIJKLMNOPQRSTUVWXYZuvwxyz
